services:
  - type: web
    name: proski-human-annos
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proski-db
          property: connectionString

databases:
  - name: proski-db
    databaseName: proski_human_annos
    user: proski_user
    plan: free
